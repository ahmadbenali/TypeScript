<button (click)="showHeadphones()">Show Second Product</button>

<app-product-details
  [name]="productName()"
  [description]="productDescription()"
  [price]="productPrice()"
  [isAvailable]="productAvailable()"
  (addToCart)="onAddToCart($event)"
/>

<app-shopping-cart
  [name]="cartName()"
  [price]="cartPrice()"
  [quantity]="cartQuantity()"
/>
