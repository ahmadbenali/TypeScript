<h3>ELECTROSHOP • PRODUCT DETAILS</h3>
<h2>{{ name }}</h2>
<p>{{ description }}</p>
<p>Price: ${{ price }} | Status: {{ isAvailable ? 'Available' : 'Out of stock' }}</p>

<button (click)="decrease()">−</button>
<span>{{ quantity() }}</span>
<button (click)="increase()">+</button>
<button (click)="add()" [disabled]="!isAvailable">Add to Cart</button>
